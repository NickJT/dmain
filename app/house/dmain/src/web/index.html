<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<title>Temperatures</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <div id="banner" role="status"></div>
  <ul id="rows"></ul>
  <footer><span id="foot">Loading…</span><a href="/motion">Motion</a><a href="/rooms">Rooms</a></footer>
</main>
<script src="/common.js"></script>
<script>
  const rows = document.getElementById("rows");

  // Built with textContent throughout: labels come from a config file, and
  // nothing from it is ever parsed as markup.
  function render(d) {
    rows.replaceChildren(...d.rows.map((r) => {
      const li = document.createElement("li");
      if (r.stale) li.classList.add("stale");
      if (r.outside) li.classList.add("outside");
      const left = document.createElement("div");
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = r.label;
      const when = document.createElement("div");
      when.className = "age";
      when.textContent = ago(r.age_s, "no reading");
      left.append(name, when);
      const temp = document.createElement("div");
      temp.className = "temp";
      if (r.c == null) {
        temp.textContent = "—";
      } else {
        temp.textContent = r.c.toFixed(1);
        const unit = document.createElement("span");
        unit.className = "unit";
        unit.textContent = "°C";
        temp.append(unit);
      }
      if (r.rh != null) {
        const rh = document.createElement("span");
        rh.className = "rh";
        rh.textContent = r.rh + "%";
        temp.append(rh);
      }
      li.append(left, temp);
      return li;
    }));
  }

  poll("/api/temps", render);
</script>
</body>
</html>
